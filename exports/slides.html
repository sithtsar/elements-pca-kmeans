    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

le-neighbours-in-the-same-cluster\"\u003EQ2 \u00b7 Are table neighbours in the same cluster?\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ENeighbours touch in the table: side by side, or one above the other. We shuffle the labels 5000 times to see what chance gives.\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;73%\u0026quot;' data-label='\u0026quot;Neighbours in the same cluster\u0026quot;' data-caption='\u0026quot;154 pairs\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;20%\u0026quot;' data-label='\u0026quot;Expected by chance\u0026quot;' data-caption='\u0026quot;5000 shuffles\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;0.0002\u0026quot;' data-label='\u0026quot;p-value\u0026quot;' data-caption='\u0026quot;no shuffle came close\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003EDown a group: \u003Cstrong\u003E72%\u003C/strong\u003E vs 20% by chance. Along a period: \u003Cstrong\u003E75%\u003C/strong\u003E vs 20%.\u003C/li\u003E\n\u003Cli\u003EMatch (ARI, 0 = chance, 1 = perfect): group 0.42, family 0.39, period 0.25.\u003C/li\u003E\n\u003Cli\u003ESame result with other ways to fill the blanks, and with no filled values at all.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "d9b0df947aed46826181be0483
